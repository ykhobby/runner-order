# Publishes dist/ to GitHub Pages on every push to main, after the tests pass.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/*.test.cjs
      # GitHub Pages lets browsers reuse files for 10 minutes; stamping links with this release
      # makes a new page fetch its matching stylesheet and scripts instead of mixing old and new.
      - name: Stamp asset links with this release
        run: |
          version="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=${version}/g; s/name=\"runner-version\" content=\"dev\"/name=\"runner-version\" content=\"${version}\"/" dist/*.html
          grep -c "?v=${version}" dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
